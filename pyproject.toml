[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedarshield"
version = "1.0.0"
description = "Autonomous authorization drift diagnosis, patch synthesis, and tamper-evident governance for AI agents using AWS Bedrock AgentCore and Cedar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CedarShield Contributors", email = "security@cedarshield.dev" }
]
keywords = [
    "aws",
    "bedrock",
    "agentcore",
    "cedar",
    "authorization",
    "mcp",
    "step-functions",
    "dynamodb",
    "merkle-tree"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "cedarpy>=0.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "detect-secrets>=1.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["tests/live", ".git", "frontend", "infra", "scripts"]
python_files = ["test_*.py"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: marks tests as requiring real AWS credentials and cloud infrastructure",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "frontend",
    "tests/live",
    "scripts",
    ".gemini",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

