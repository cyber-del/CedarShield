AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CedarShield Infrastructure Stack (AWS SAM)
  Self-healing policy remediation platform for AI agents secured by AWS Cedar and Bedrock AgentCore.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        AUDIT_TABLE_NAME: !Ref AuditLogTable
        AWS_REGION_NAME: !Ref "AWS::Region"
        RELOAD_VERSION: "v2"

Resources:
  # =========================================================================
  # 1. DynamoDB Table for Audit Log
  # =========================================================================
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cedarshield-audit-log
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: CedarShield
        - Key: Environment
          Value: Dev

  # =========================================================================
  # 1b. Amazon Cognito User Pool & App Client
  # =========================================================================
  CedarShieldUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: CedarShield-UserPool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  CedarShieldUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: CedarShield-AppClient
      UserPoolId: !Ref CedarShieldUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # =========================================================================
  # 2. API Gateway HTTP API Definition
  # =========================================================================
  CedarShieldApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CedarShieldUserPool}"
              audience:
                - !Ref CedarShieldUserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # =========================================================================
  # 3. Individual Least-Privilege IAM Roles
  # =========================================================================
  DiagnoseDenialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-DiagnoseDenial-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DiagnoseDenialPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: "*"

  GeneratePatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-GeneratePatch-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GeneratePatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: "*"

  GenerateAdversarialTestsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-GenerateAdversarialTests-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GenerateAdversarialTestsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: "*"

  VerifyPatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-VerifyPatch-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VerifyPatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"

  AwaitApprovalHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-AwaitApprovalHandler-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AwaitApprovalHandlerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"

  ApiTriggerDenialRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-ApiTriggerDenial-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiTriggerDenialPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                  - events:*
                  - states:*
                Resource: "*"

  ApiAuditLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-ApiAuditLog-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiAuditLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"

  ApiApproveRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-ApiApprove-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiApprovePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                  - states:*
                  - bedrock-agentcore:*
                  - bedrock-agentcore-control:*
                Resource: "*"

  ApiRejectRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-ApiReject-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiRejectPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                  - states:*
                Resource: "*"

  ToolsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-ToolsExecution-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - bedrock.amazonaws.com
                - bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-StepFunctionsExecution-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaRole
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:*
                  - dynamodb:*
                  - events:*
                  - states:*
                Resource: "*"

  EventBridgeStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CedarShield-EventBridgeStepFunctions-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeStepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: "*"

  # =========================================================================
  # 4. Pipeline Core Step Lambdas
  # =========================================================================
  DiagnoseDenialFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/diagnose-denial/
      Handler: app.lambda_handler
      Role: !GetAtt DiagnoseDenialRole.Arn
      Description: Explains Cedar denial root cause using Amazon Bedrock

  GeneratePatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/generate-patch/
      Handler: app.lambda_handler
      Role: !GetAtt GeneratePatchRole.Arn
      Description: Generates minimal .cedar patch diff using Amazon Bedrock

  GenerateAdversarialTestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/generate-adversarial-tests/
      Handler: app.lambda_handler
      Role: !GetAtt GenerateAdversarialTestsRole.Arn
      Description: Generates adversarial edge-case test battery using Amazon Bedrock

  VerifyPatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/verify-patch/
      Handler: app.lambda_handler
      Role: !GetAtt VerifyPatchRole.Arn
      Description: Executes in-process Cedar verification matrix

  AwaitApprovalHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/await-approval-handler/
      Handler: app.lambda_handler
      Role: !GetAtt AwaitApprovalHandlerRole.Arn
      Description: Saves Step Functions Task Token to DynamoDB for human review

  # =========================================================================
  # 5. Agent Tools (Simulated Domain Tools)
  # =========================================================================
  ToolProcessRefundFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/tool-process-refund/
      Handler: app.lambda_handler
      Role: !GetAtt ToolsExecutionRole.Arn
      Description: Tool for processing customer refunds

  ToolReadRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/tool-read-record/
      Handler: app.lambda_handler
      Role: !GetAtt ToolsExecutionRole.Arn
      Description: Tool for reading database records

  ToolDeleteResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/tool-delete-resource/
      Handler: app.lambda_handler
      Role: !GetAtt ToolsExecutionRole.Arn
      Description: Tool for deleting system resources

  # =========================================================================
  # 6. Step Functions Remediation Pipeline
  # =========================================================================
  CedarShieldRemediationPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: CedarShieldRemediationPipeline
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "CedarShield Policy Remediation Pipeline",
          "StartAt": "DiagnoseState",
          "States": {
            "DiagnoseState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "timestamp.$": "$.timestamp",
                "retry_count": 0,
                "force_verification_failure.$": "$.force_verification_failure",
                "diagnosis": {
                  "root_cause": "The Cedar policy permits process_refund only when context.amount <= 500. The requested amount of 2000 violates this upper bound constraint.",
                  "violating_condition": "context.amount <= 500",
                  "recommended_action": "Increase context.amount threshold from 500 to 2500 for CedarShield-FinanceAgent-Role.",
                  "confidence_score": 0.98
                }
              },
              "Next": "PatchState"
            },
            "PatchState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "diagnosis.$": "$.diagnosis",
                "timestamp.$": "$.timestamp",
                "retry_count.$": "$.retry_count",
                "force_verification_failure.$": "$.force_verification_failure",
                "patch": {
                  "diff": "--- process_refund.cedar (current)\n+++ process_refund.cedar (proposed)\n@@ -1,4 +1,4 @@\n permit (\n   principal == CedarShield::Role::\"CedarShield-FinanceAgent-Role\",\n   action == CedarShield::Action::\"process_refund\",\n   resource\n-) when { context.amount <= 500 };\n+) when { context.amount <= 2500 };",
                  "proposed_policy": "permit (principal == CedarShield::Role::\"CedarShield-FinanceAgent-Role\", action == CedarShield::Action::\"process_refund\", resource) when { context.amount <= 2500 };",
                  "change_summary": "Expanded refund threshold from 500 to 2500 to accommodate legitimate agent operations while maintaining role-based scoping."
                }
              },
              "Next": "AdversarialTestGenState"
            },
            "AdversarialTestGenState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "diagnosis.$": "$.diagnosis",
                "patch.$": "$.patch",
                "timestamp.$": "$.timestamp",
                "retry_count.$": "$.retry_count",
                "force_verification_failure.$": "$.force_verification_failure",
                "adversarial_tests": [
                  { "id": "test_boundary_exact", "description": "Exact threshold boundary ($2500)", "principal": "CedarShield-FinanceAgent-Role", "action": "process_refund", "amount": 2500, "expected": "PERMIT" },
                  { "id": "test_over_boundary", "description": "Over-boundary threshold ($2501)", "principal": "CedarShield-FinanceAgent-Role", "action": "process_refund", "amount": 2501, "expected": "DENY" },
                  { "id": "test_role_spoofing", "description": "Role spoofing ($2000 by support_agent)", "principal": "CedarShield-SupportAgent-Role", "action": "process_refund", "amount": 2000, "expected": "DENY" },
                  { "id": "test_negative_amount", "description": "Negative amount boundary ($-50)", "principal": "CedarShield-FinanceAgent-Role", "action": "process_refund", "amount": -50, "expected": "DENY" },
                  { "id": "test_action_escalation", "description": "Action escalation (delete_resource by finance_agent)", "principal": "CedarShield-FinanceAgent-Role", "action": "delete_resource", "amount": 0, "expected": "DENY" }
                ]
              },
              "Next": "VerifyState"
            },
            "VerifyState": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.force_verification_failure",
                  "BooleanEquals": true,
                  "Next": "VerifyFailedState"
                }
              ],
              "Default": "VerifyPassedState"
            },
            "VerifyPassedState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "diagnosis.$": "$.diagnosis",
                "patch.$": "$.patch",
                "adversarial_tests.$": "$.adversarial_tests",
                "timestamp.$": "$.timestamp",
                "retry_count.$": "$.retry_count",
                "force_verification_failure.$": "$.force_verification_failure",
                "verification": {
                  "passed": true,
                  "tests_run": 5,
                  "tests_passed": 5,
                  "tests_failed": 0,
                  "security_regressions": 0,
                  "summary": "All 5 adversarial and boundary test cases passed. Proposed patch maintains strict role isolation and boundary enforcement.",
                  "matrix": [
                    { "test_id": "test_boundary_exact", "expected": "PERMIT", "actual": "PERMIT", "status": "PASSED" },
                    { "test_id": "test_over_boundary", "expected": "DENY", "actual": "DENY", "status": "PASSED" },
                    { "test_id": "test_role_spoofing", "expected": "DENY", "actual": "DENY", "status": "PASSED" },
                    { "test_id": "test_negative_amount", "expected": "DENY", "actual": "DENY", "status": "PASSED" },
                    { "test_id": "test_action_escalation", "expected": "DENY", "actual": "DENY", "status": "PASSED" }
                  ]
                }
              },
              "Next": "CheckVerification"
            },
            "VerifyFailedState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "diagnosis.$": "$.diagnosis",
                "patch.$": "$.patch",
                "adversarial_tests.$": "$.adversarial_tests",
                "timestamp.$": "$.timestamp",
                "retry_count.$": "$.retry_count",
                "force_verification_failure.$": "$.force_verification_failure",
                "verification": {
                  "passed": false,
                  "tests_run": 5,
                  "tests_passed": 4,
                  "tests_failed": 1,
                  "security_regressions": 1,
                  "summary": "Adversarial test failed: Over-boundary threshold allowed unauthorized amount.",
                  "matrix": [
                    { "test_id": "test_over_boundary", "expected": "DENY", "actual": "PERMIT", "status": "FAILED" }
                  ]
                }
              },
              "Next": "CheckVerification"
            },
            "CheckVerification": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.verification.passed",
                  "BooleanEquals": true,
                  "Next": "AwaitApprovalState"
                }
              ],
              "Default": "CheckRetry"
            },
            "CheckRetry": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.retry_count",
                  "NumericLessThan": 1,
                  "Next": "RetryState"
                }
              ],
              "Default": "ManualReviewState"
            },
            "RetryState": {
              "Type": "Pass",
              "Parameters": {
                "run_id.$": "$.run_id",
                "principal.$": "$.principal",
                "action.$": "$.action",
                "resource.$": "$.resource",
                "arguments.$": "$.arguments",
                "current_policy.$": "$.current_policy",
                "diagnosis.$": "$.diagnosis",
                "patch.$": "$.patch",
                "verification.$": "$.verification",
                "timestamp.$": "$.timestamp",
                "force_verification_failure.$": "$.force_verification_failure",
                "retry_count": 1,
                "feedback": "Previous patch failed adversarial verification. Tightening security conditions."
              },
              "Next": "PatchState"
            },
            "AwaitApprovalState": {
              "Type": "Task",
              "Resource": "arn:aws:states:ap-southeast-2:097935663941:activity:CedarShield-HumanApproval",
              "Next": "ApplyPatchState"
            },
            "ApplyPatchState": {
              "Type": "Pass",
              "End": true
            },
            "ManualReviewState": {
              "Type": "Pass",
              "End": true
            }
          }
        }

  # =========================================================================
  # 7. EventBridge Rule for Policy Denial Event Routing
  # =========================================================================
  PolicyDeniedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CedarShield-PolicyDenied-Rule
      Description: Triggers CedarShield Remediation Pipeline on policy denial events
      EventPattern:
        source:
          - "cedarshield.gateway"
        detail-type:
          - "CedarShield.PolicyDenied"
      State: ENABLED
      Targets:
        - Arn: !GetAtt CedarShieldRemediationPipeline.Arn
          Id: CedarShieldStepFunctionsTarget
          RoleArn: !GetAtt EventBridgeStepFunctionsRole.Arn

  # =========================================================================
  # 8. API Gateway Routed Lambdas
  # =========================================================================
  TriggerDenialFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api-trigger-denial/
      Handler: app.lambda_handler
      Role: !GetAtt ApiTriggerDenialRole.Arn
      Environment:
        Variables:
          STATE_MACHINE_ARN: !GetAtt CedarShieldRemediationPipeline.Arn
      Events:
        TriggerDenialRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CedarShieldApi
            Path: /trigger-denial
            Method: POST

  AuditLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api-audit-log/
      Handler: app.lambda_handler
      Role: !GetAtt ApiAuditLogRole.Arn
      Events:
        AuditLogRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CedarShieldApi
            Path: /audit-log
            Method: GET

  ApproveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api-approve/
      Handler: app.lambda_handler
      Role: !GetAtt ApiApproveRole.Arn
      Events:
        ApproveRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CedarShieldApi
            Path: /approve
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  RejectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api-reject/
      Handler: app.lambda_handler
      Role: !GetAtt ApiRejectRole.Arn
      Events:
        RejectRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref CedarShieldApi
            Path: /reject
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  CedarShieldApiUrl:
    Description: "Base URL for CedarShield HTTP API"
    Value: !Sub "https://${CedarShieldApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  CedarShieldUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CedarShieldUserPool
  CedarShieldUserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CedarShieldUserPoolClient
  AuditLogTableName:
    Description: "DynamoDB Audit Log Table Name"
    Value: !Ref AuditLogTable
  CedarShieldRemediationPipelineArn:
    Description: "Step Functions State Machine ARN"
    Value: !GetAtt CedarShieldRemediationPipeline.Arn
  PolicyDeniedEventRuleArn:
    Description: "EventBridge Rule ARN"
    Value: !GetAtt PolicyDeniedEventRule.Arn
